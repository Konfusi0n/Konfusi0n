<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="system-map-title system-map-desc">
  <title id="system-map-title">One thesis across four intelligent systems</title>
  <desc id="system-map-desc">Agent Sandbox, Mira, Automata, and Spider Sense share an inspectable core of validated state, visible evidence, and bounded authority.</desc>
  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <radialGradient id="map-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#45cbd1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#45cbd1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="map-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6d89a3" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#map-bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" fill="none" stroke="#4d6d87" stroke-width="3"/>
  <rect width="1200" height="400" rx="24" fill="url(#map-grid)"/>

  <g fill="none" stroke-linecap="round" stroke-width="4" opacity="0.9">
    <path d="M370 132 C414 132 424 160 450 174" stroke="#45cbd1"/>
    <path d="M830 132 C786 132 776 160 750 174" stroke="#d78a4b"/>
    <path d="M370 292 C414 292 424 256 450 236" stroke="#d78a4b"/>
    <path d="M830 292 C786 292 776 256 750 236" stroke="#45cbd1"/>
  </g>

  <circle cx="600" cy="205" r="134" fill="url(#map-core)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="48" text-anchor="middle" fill="#45cbd1" font-size="18" font-weight="700" letter-spacing="3.5">ONE THESIS · FOUR SYSTEMS</text>

    <rect x="70" y="82" width="300" height="100" rx="16" fill="#0b1727" stroke="#4d6d87" stroke-width="2"/>
    <rect x="70" y="82" width="8" height="100" rx="4" fill="#45cbd1"/>
    <text x="104" y="118" fill="#45cbd1" font-size="16" font-weight="700" letter-spacing="2.2">EMERGENT WORLDS</text>
    <text x="104" y="158" fill="#f7f3e8" font-size="30" font-weight="700">AGENT SANDBOX</text>

    <rect x="830" y="82" width="300" height="100" rx="16" fill="#0b1727" stroke="#4d6d87" stroke-width="2"/>
    <rect x="1122" y="82" width="8" height="100" rx="4" fill="#45cbd1"/>
    <text x="864" y="118" fill="#45cbd1" font-size="16" font-weight="700" letter-spacing="2.2">CONVERSATION</text>
    <text x="864" y="158" fill="#f7f3e8" font-size="32" font-weight="700">MIRA</text>

    <rect x="70" y="242" width="300" height="100" rx="16" fill="#0b1727" stroke="#4d6d87" stroke-width="2"/>
    <rect x="70" y="242" width="8" height="100" rx="4" fill="#d78a4b"/>
    <text x="104" y="278" fill="#d78a4b" font-size="16" font-weight="700" letter-spacing="2.2">COORDINATION</text>
    <text x="104" y="318" fill="#f7f3e8" font-size="32" font-weight="700">AUTOMATA</text>

    <rect x="830" y="242" width="300" height="100" rx="16" fill="#0b1727" stroke="#4d6d87" stroke-width="2"/>
    <rect x="1122" y="242" width="8" height="100" rx="4" fill="#d78a4b"/>
    <text x="864" y="278" fill="#d78a4b" font-size="16" font-weight="700" letter-spacing="2.2">RESEARCH</text>
    <text x="864" y="318" fill="#f7f3e8" font-size="30" font-weight="700">SPIDER SENSE</text>

    <rect x="450" y="125" width="300" height="160" rx="20" fill="#0b1727" stroke="#45cbd1" stroke-width="3"/>
    <g shape-rendering="crispEdges">
      <rect x="580" y="148" width="40" height="40" fill="#d78a4b"/>
      <rect x="590" y="158" width="20" height="20" fill="#f0cf96"/>
      <rect x="596" y="164" width="8" height="8" fill="#07111f"/>
      <rect x="556" y="164" width="12" height="12" fill="#45cbd1"/>
      <rect x="632" y="164" width="12" height="12" fill="#45cbd1"/>
    </g>
    <text x="600" y="224" text-anchor="middle" fill="#f7f3e8" font-size="28" font-weight="700">INSPECTABLE CORE</text>
    <text x="600" y="256" text-anchor="middle" fill="#aebdca" font-size="16" font-weight="600" letter-spacing="1.4">STATE · EVIDENCE · AUTHORITY</text>
  </g>
</svg>
