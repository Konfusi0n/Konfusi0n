<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">The Direct Autonomy Systems foundry</title>
<desc id="desc">Four distinct core systems share bounded authority doctrine and support governance worlds, simulations, human augmentation, asset compilation, context continuity, evidence ingestion, and proof lanes without sharing private memory, secrets, identities, or earned authority.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05090d"/><stop offset="1" stop-color="#0a1118"/></linearGradient>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#6a8495" stroke-opacity=".10"/><path d="M0 52L52 0" stroke="#6a8495" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .card{fill:#0a1118;stroke:#4b5e6b;stroke-width:1.4}
    .role{font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:2px}
    .title{fill:#f4f7f9;font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:750;font-size:28px}
    .body{fill:#aebbc4;font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:500;font-size:15px}
    .rail-title{fill:#f4f7f9;font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:750;font-size:24px;letter-spacing:1px}
    .rail-body{fill:#aebbc4;font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:500;font-size:15px;letter-spacing:.6px}
  </style>
</defs>
<rect width="1400" height="760" rx="26" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1397" height="757" rx="24.5" fill="none" stroke="#536774" stroke-width="3"/>
<rect width="1400" height="760" rx="26" fill="url(#grid)"/>
<circle cx="700" cy="348" r="220" fill="#1f9bc7" opacity=".045" filter="url(#glow)"/>
<text x="700" y="62" text-anchor="middle" fill="#56d5ff" style="font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:700;font-size:18px;letter-spacing:5px">THE DIRECT AUTONOMY FOUNDRY</text>
<text x="700" y="99" text-anchor="middle" fill="#dce4e9" style="font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:650;font-size:26px">One foundry. Distinct systems. Shared laws—not shared sovereignty.</text>

    <g>
      <rect x="55" y="145" width="300" height="170" rx="18" class="card"/>
      <rect x="55" y="145" width="7" height="170" rx="3.5" fill="#56D5FF"/>
      <text x="79" y="183" class="role" fill="#56D5FF">TRUST / EXECUTION</text>
      <text x="79" y="226" class="title" style="font-size:26px">AUREON-HERMES</text>
      <text x="79" y="257" class="body">admission · authorization</text><text x="79" y="281" class="body">verification · recovery</text>
    </g>
    <g>
      <rect x="385" y="145" width="300" height="170" rx="18" class="card"/>
      <rect x="385" y="145" width="7" height="170" rx="3.5" fill="#E8F0F5"/>
      <text x="409" y="183" class="role" fill="#E8F0F5">PRESENCE</text>
      <text x="409" y="226" class="title" style="font-size:32px">MIRA</text>
      <text x="409" y="257" class="body">voice · multimodal collaboration</text><text x="409" y="281" class="body">interruptible operator control</text>
    </g>
    <g>
      <rect x="715" y="145" width="300" height="170" rx="18" class="card"/>
      <rect x="715" y="145" width="7" height="170" rx="3.5" fill="#56D5FF"/>
      <text x="739" y="183" class="role" fill="#56D5FF">EVIDENCE / CANON</text>
      <text x="739" y="226" class="title" style="font-size:27px">SPIDER SENSE</text>
      <text x="739" y="257" class="body">sources · freshness · conflict</text><text x="739" y="281" class="body">traceable research synthesis</text>
    </g>
    <g>
      <rect x="1045" y="145" width="300" height="170" rx="18" class="card"/>
      <rect x="1045" y="145" width="7" height="170" rx="3.5" fill="#E8F0F5"/>
      <text x="1069" y="183" class="role" fill="#E8F0F5">COORDINATION / EVOLUTION</text>
      <text x="1069" y="226" class="title" style="font-size:29px">AUTOMATA</text>
      <text x="1069" y="257" class="body">scope · leases · handoffs</text><text x="1069" y="281" class="body">architecture memory · proof</text>
    </g>
    <g>
      <rect x="55" y="505" width="300" height="142" rx="18" class="card"/>
      <rect x="55" y="505" width="7" height="142" rx="3.5" fill="#56D5FF"/>
      <text x="79" y="543" class="role" fill="#56D5FF">GOVERNANCE WORLDS</text>
      <text x="79" y="586" class="title" style="font-size:22px">PRAXEON / TELAXIS</text>
      <text x="79" y="617" class="body">bounded decisions</text><text x="79" y="641" class="body">persistent consequence</text>
    </g>
    <g>
      <rect x="385" y="505" width="300" height="142" rx="18" class="card"/>
      <rect x="385" y="505" width="7" height="142" rx="3.5" fill="#E8F0F5"/>
      <text x="409" y="543" class="role" fill="#E8F0F5">EMERGENT SIMULATION</text>
      <text x="409" y="586" class="title" style="font-size:19px">AGENT SANDBOX / INKWAKE</text>
      <text x="409" y="617" class="body">deterministic worlds</text><text x="409" y="641" class="body">inspectable change</text>
    </g>
    <g>
      <rect x="715" y="505" width="300" height="142" rx="18" class="card"/>
      <rect x="715" y="505" width="7" height="142" rx="3.5" fill="#56D5FF"/>
      <text x="739" y="543" class="role" fill="#56D5FF">HUMAN AUGMENTATION</text>
      <text x="739" y="586" class="title" style="font-size:18px">GHOST WRITER / GHOSTPASTE</text>
      <text x="739" y="617" class="body">quiet previews</text><text x="739" y="641" class="body">explicit acceptance</text>
    </g>
    <g>
      <rect x="1045" y="505" width="300" height="142" rx="18" class="card"/>
      <rect x="1045" y="505" width="7" height="142" rx="3.5" fill="#E8F0F5"/>
      <text x="1069" y="543" class="role" fill="#E8F0F5">SUPPORTING SYSTEMS</text>
      <text x="1069" y="586" class="title" style="font-size:18px">PIXELFORGE + CONTEXT HUB</text>
      <text x="1069" y="617" class="body">Reddit Monitor · proof lanes</text><text x="1069" y="641" class="body">representation · continuity</text>
    </g>
<!-- core-to-substrate connectors -->
<g stroke="#56d5ff" stroke-width="2" opacity=".68" fill="none">
  <path d="M205 315V350H350"/><path d="M535 315V350H570"/><path d="M865 315V350H830"/><path d="M1195 315V350H1050"/>
</g>
<g fill="#56d5ff"><circle cx="205" cy="315" r="4"/><circle cx="535" cy="315" r="4"/><circle cx="865" cy="315" r="4"/><circle cx="1195" cy="315" r="4"/></g>
<rect x="140" y="350" width="1120" height="105" rx="20" fill="#081018" stroke="#56d5ff" stroke-width="2"/>
<text x="700" y="390" text-anchor="middle" class="rail-title">SHARED DAS SUBSTRATE</text>
<text x="700" y="421" text-anchor="middle" class="rail-body">explicit authority · scoped identity · provenance · bounded budgets and retries · revocation · recovery · rollback</text>
<text x="700" y="445" text-anchor="middle" fill="#56d5ff" style="font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:650;font-size:13px;letter-spacing:2px">MODELS AND PROVIDERS REMAIN REPLACEABLE</text>
<!-- substrate-to-product connectors -->
<g stroke="#7b8f9b" stroke-width="1.7" opacity=".72" fill="none"><path d="M350 455V482H205V505"/><path d="M570 455V482H535V505"/><path d="M830 455V482H865V505"/><path d="M1050 455V482H1195V505"/></g>
<line x1="82" y1="693" x2="1318" y2="693" stroke="#526773"/>
<text x="700" y="726" text-anchor="middle" fill="#aebbc4" style="font-family:'Segoe UI',Inter,Arial,sans-serif;font-weight:650;font-size:13px;letter-spacing:2px">NO SHARED PRIVATE MEMORY · NO SHARED SECRETS · NO INHERITED EARNED AUTHORITY</text>
</svg>
