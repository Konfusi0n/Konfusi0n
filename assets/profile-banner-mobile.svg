      <stop offset="0.55" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <radialGradient id="mobile-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#45cbd1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#45cbd1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6d89a3" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
  </defs>

