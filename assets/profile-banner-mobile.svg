<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="mobile-banner-title mobile-banner-desc">
  <title id="mobile-banner-title">Cameron Marriott — Inspectable Intelligent Systems</title>
  <desc id="mobile-banner-desc">A centered copper, cream, and cyan pixel citadel on deep navy, representing emergence, branching agents, and inspectable intelligence.</desc>
  <defs>
