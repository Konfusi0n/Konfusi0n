<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img" aria-labelledby="mobile-map-title mobile-map-desc">
  <title id="mobile-map-title">One thesis across four intelligent systems</title>
  <desc id="mobile-map-desc">Agent Sandbox, Mira, Automata, and Spider Sense share an inspectable core of validated state, visible evidence, and bounded authority.</desc>
  <defs>
    <linearGradient id="mobile-map-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <radialGradient id="mobile-map-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#45cbd1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#45cbd1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mobile-map-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6d89a3" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="720" height="930" rx="24" fill="url(#mobile-map-bg)"/>
  <rect x="1.5" y="1.5" width="717" height="927" rx="22.5" fill="none" stroke="#4d6d87" stroke-width="3"/>
  <rect width="720" height="930" rx="24" fill="url(#mobile-map-grid)"/>

  <g fill="none" stroke-linecap="round" stroke-width="5" opacity="0.9">
    <path d="M230 220 C230 300 270 342 300 405" stroke="#45cbd1"/>
    <path d="M490 375 C490 394 460 398 430 405" stroke="#45cbd1"/>
    <path d="M230 605 C230 586 270 580 300 575" stroke="#d78a4b"/>
    <path d="M490 760 C490 680 450 635 420 575" stroke="#d78a4b"/>
  </g>

  <circle cx="360" cy="490" r="230" fill="url(#mobile-map-core)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="360" y="52" text-anchor="middle" fill="#45cbd1" font-size="24" font-weight="700" letter-spacing="3.5">ONE THESIS · FOUR SYSTEMS</text>

    <rect x="70" y="90" width="580" height="130" rx="18" fill="#0b1727" stroke="#4d6d87" stroke-width="3"/>
    <rect x="70" y="90" width="10" height="130" rx="5" fill="#45cbd1"/>
    <text x="112" y="140" fill="#45cbd1" font-size="22" font-weight="700" letter-spacing="2.4">EMERGENT WORLDS</text>
    <text x="112" y="190" fill="#f7f3e8" font-size="38" font-weight="700">AGENT SANDBOX</text>

    <rect x="70" y="245" width="580" height="130" rx="18" fill="#0b1727" stroke="#4d6d87" stroke-width="3"/>
    <rect x="640" y="245" width="10" height="130" rx="5" fill="#45cbd1"/>
    <text x="112" y="295" fill="#45cbd1" font-size="22" font-weight="700" letter-spacing="2.4">CONVERSATION</text>
    <text x="112" y="345" fill="#f7f3e8" font-size="40" font-weight="700">MIRA</text>

    <rect x="120" y="405" width="480" height="170" rx="22" fill="#0b1727" stroke="#45cbd1" stroke-width="4"/>
    <g shape-rendering="crispEdges">
      <rect x="336" y="430" width="48" height="48" fill="#d78a4b"/>
      <rect x="348" y="442" width="24" height="24" fill="#f0cf96"/>
      <rect x="355" y="449" width="10" height="10" fill="#07111f"/>
      <rect x="304" y="448" width="14" height="14" fill="#45cbd1"/>
      <rect x="402" y="448" width="14" height="14" fill="#45cbd1"/>
    </g>
    <text x="360" y="520" text-anchor="middle" fill="#f7f3e8" font-size="36" font-weight="700">INSPECTABLE CORE</text>
    <text x="360" y="554" text-anchor="middle" fill="#aebdca" font-size="22" font-weight="600" letter-spacing="1.1">STATE · EVIDENCE · AUTHORITY</text>

    <rect x="70" y="605" width="580" height="130" rx="18" fill="#0b1727" stroke="#4d6d87" stroke-width="3"/>
    <rect x="70" y="605" width="10" height="130" rx="5" fill="#d78a4b"/>
    <text x="112" y="655" fill="#d78a4b" font-size="22" font-weight="700" letter-spacing="2.4">COORDINATION</text>
    <text x="112" y="705" fill="#f7f3e8" font-size="40" font-weight="700">AUTOMATA</text>

    <rect x="70" y="760" width="580" height="130" rx="18" fill="#0b1727" stroke="#4d6d87" stroke-width="3"/>
    <rect x="640" y="760" width="10" height="130" rx="5" fill="#d78a4b"/>
    <text x="112" y="810" fill="#d78a4b" font-size="22" font-weight="700" letter-spacing="2.4">RESEARCH</text>
    <text x="112" y="860" fill="#f7f3e8" font-size="38" font-weight="700">SPIDER SENSE</text>
  </g>
</svg>
